[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steles-pipeline"
version = "2.3.0"
description = "Data reduction pipeline for the STELES spectrograph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Felipe Navarete" }
]
dependencies = [
    "astropy",
    "ccdproc",
    "lacosmic",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "scipy"
]

[tool.setuptools.packages.find]
include = ["steles_pipeline*"]

[tool.setuptools.package-data]
steles_pipeline = [
    "**/*.json",
    "**/*.csv",
    "**/*.fits",
    "**/*.fit",
    "**/*.dat"
]
